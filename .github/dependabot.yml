version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # The lower bounds in requirements-host.txt are feature floors, not
    # latest-version pins: they stay wide so host tooling installs on the oldest
    # interpreter it supports. The default strategy raises them regardless, which
    # only narrows host compatibility, so limit updates to releases the current
    # range actually excludes.
    versioning-strategy: increase-if-necessary
